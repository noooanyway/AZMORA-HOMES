<!doctype html>
<html lang="pt-PT">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><meta name="robots" content="noindex,nofollow" /><title>
    Inventário · Azmora Homes
  </title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #f8f5ee;
      color: #234237;
      font:
        16px/1.5 system-ui,
        sans-serif;
    }
    header {
      background: #234237;
      color: #faf5e9;
      padding: 18px max(5vw, 18px);
      font-size: 20px;
    }
    main {
      max-width: 1100px;
      margin: auto;
      padding: 24px clamp(16px, 4vw, 54px) 80px;
    }
    h1,
    h2,
    legend {
      font-family: Georgia, serif;
      font-weight: 500;
    }
    h1 {
      font-size: clamp(32px, 5vw, 54px);
      line-height: 1.1;
    }
    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
      padding: 9px 12px;
      border: 1px solid #aaa996;
      border-radius: 4px;
      background: #fffdf8;
    }
    button {
      cursor: pointer;
      min-height: 42px;
    }
    button.primary {
      background: #234237;
      color: white;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .row,
    .stats,
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .stats > div {
      padding: 12px;
      background: #ebe5d8;
      flex: 1;
      min-width: 105px;
    }
    .stats strong {
      display: block;
      font: 32px Georgia;
    }
    .unit {
      border-top: 1px solid #c9c3b4;
      padding: 14px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .unit small,
    label {
      display: block;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr));
      gap: 14px;
    }
    fieldset {
      margin: 20px 0;
      padding: 16px;
      border: 1px solid #c9c3b4;
    }
    legend {
      font-size: 23px;
    }
    label input,
    label select,
    label textarea {
      width: 100%;
      margin-top: 4px;
    }
    textarea {
      min-height: 96px;
    }
    .drop {
      border: 1px dashed #667868;
      padding: 14px;
    }
    .photo {
      margin: 12px 0;
      padding: 12px;
      background: #eee9df;
    }
    .photo img,
    #preview img {
      width: 160px;
      height: 110px;
      object-fit: cover;
    }
    dialog {
      max-width: min(840px, 94vw);
      max-height: 90vh;
      color: inherit;
      background: #fffdf8;
      border: 1px solid #abc;
      padding: 24px;
    }
    #notice:not(:empty) {
      position: sticky;
      top: 0;
      background: #fff3d9;
      border-left: 4px solid #a8653e;
      padding: 10px;
      z-index: 2;
    }
    button:focus-visible,
    :focus-visible {
      outline: 3px solid #995529;
      outline-offset: 2px;
    }
    [hidden] {
      display: none !important;
    }
  </style>
  <header>Azmora Homes · Administração</header>
  <main>
    <p role="status" id="notice"></p>
    <section id="dash">
      <h1>Inventário de casas</h1>
      <div class="stats" id="stats"></div>
      <h2>Catálogo</h2>
      <div class="row">
        <button class="primary" id="add">Adicionar casa</button
        ><input
          aria-label="Pesquisar casas"
          placeholder="Nome, marca ou referência"
          id="search"
        /><select aria-label="Filtrar anúncios" id="filter">
          <option value="">Todos os anúncios</option>
          <option value="live">Publicados</option>
          <option value="draft">Rascunhos</option>
          <option value="archived">Arquivados</option></select
        ><select aria-label="Ordenação" id="sort">
          <option>Nome</option>
          <option>Alterações recentes</option>
        </select>
      </div>
      <div id="list"></div>
      <h2>Atividade recente</h2>
      <ul id="events"></ul>
    </section>
    <section id="edit" hidden>
      <button id="back">← Inventário</button>
      <h1 id="heading"></h1>
      <p id="ref"></p>
      <form id="form">
        <div id="fields"></div>
        <fieldset>
          <legend>Fotografias</legend>
          <label class="drop" id="drop"
            >Arraste fotografias para aqui ou escolha os ficheiros. A primeira
            fotografia é a capa.<input
              id="files"
              type="file"
              accept="image/png,image/jpeg,image/webp"
              multiple
          /></label>
          <div id="photos"></div>
        </fieldset>
        <label
          ><input style="width: auto" id="featured" type="checkbox" /> Destacar
          na página inicial</label
        >
        <p class="actions">
          <button class="primary" type="submit" value="draft">
            Guardar rascunho</button
          ><button type="submit" value="live">Publicar alterações</button
          ><button type="button" id="peek">Pré-visualizar</button>
        </p>
      </form>
      <div id="manage" class="actions"></div>
    </section>
    <dialog id="preview">
      <button id="closePreview">Fechar</button>
      <div id="sample"></div>
    </dialog>
  </main>
  <script type="module">
    const el = (id) => document.getElementById(id),
      node = (tag, text) => {
        const n = document.createElement(tag);
        n.textContent = text;
        return n;
      },
      button = (text, fn) => {
        const b = node('button', text);
        b.type = 'button';
        b.onclick = fn;
        return b;
      };
    const base = location.pathname.replace(/\/?$/, '/'),
      states = {
        live: 'Publicada',
        draft: 'Rascunho',
        archived: 'Arquivada',
        eliminada: 'Eliminada',
      },
      stock = {
        por_confirmar: 'A confirmar',
        disponivel: 'Disponível',
        reservado: 'Reservada',
        vendido: 'Vendida',
        em_breve: 'Em breve',
      };
    let units = [],
      events = [],
      current = null,
      dirty = false,
      busy = false,
      media = [];
    const msg = (s) => (el('notice').textContent = s);
    async function api(path, body, type = 'application/json') {
      const r = await fetch(
        base + path,
        body
          ? {
              method: 'POST',
              headers: { 'Content-Type': type },
              body: type === 'application/json' ? JSON.stringify(body) : body,
            }
          : {},
      );
      if (!r.ok)
        throw Error(
          (await r.json().catch(() => ({}))).message ||
            'Falha de acesso. Reabra o painel.',
        );
      return r.json();
    }
    async function task(fn) {
      if (busy) return;
      busy = true;
      const edit = el('edit');
      edit.inert = true;
      el('dash').inert = true;
      try {
        await fn();
      } catch (e) {
        msg(e.message);
      } finally {
        edit.inert = false;
        el('dash').inert = false;
        busy = false;
      }
    }
    function draw() {
      const text = el('search').value.toLocaleLowerCase('pt'),
        filter = el('filter').value;
      const active = units.filter((u) => u.state !== 'archived');
      el('stats').replaceChildren(
        ...Object.entries({
          Total: units.length,
          Disponíveis: active.filter(
            (u) => u.data.availability === 'disponivel',
          ).length,
          Reservadas: active.filter((u) => u.data.availability === 'reservado')
            .length,
          Vendidas: active.filter((u) => u.data.availability === 'vendido')
            .length,
          Publicadas: units.filter((u) => u.state === 'live').length,
          Rascunhos: units.filter((u) => u.state === 'draft').length,
        }).map(([k, v]) => {
          const n = node('div', k);
          n.prepend(node('strong', v));
          return n;
        }),
      );
      const found = units
        .filter(
          (u) =>
            (!filter || u.state === filter) &&
            [
              u.data.name_for_site,
              u.data.brand,
              u.data.reference_azmora,
              u.slug,
            ]
              .join(' ')
              .toLowerCase()
              .includes(text),
        )
        .sort((a, b) =>
          el('sort').selectedIndex
            ? b.updated.localeCompare(a.updated)
            : a.data.name_for_site.localeCompare(b.data.name_for_site, 'pt'),
        );
      el('list').replaceChildren(
        ...found.map((u) => {
          const row = node('article', '');
          row.className = 'unit';
          const title = node('strong', u.data.name_for_site);
          title.append(
            node('small', states[u.state] + ' · ' + stock[u.data.availability]),
          );
          row.append(
            title,
            button('Abrir ficha', () => open(u)),
          );
          return row;
        }),
      );
      if (!found.length) el('list').textContent = 'Nenhuma casa encontrada.';
      el('events').replaceChildren(
        ...events.map((v) =>
          node(
            'li',
            v.at +
              ' UTC · ' +
              v.unit +
              ' · ' +
              states[v.action] +
              ' · ' +
              v.actor,
          ),
        ),
      );
    }
    async function load() {
      ({ units, events } = await api('dados/'));
      draw();
    }
    const groups = {
      Identificação: [
        ['name_for_site', 'Nome da casa'],
        ['brand', 'Marca'],
        ['model', 'Modelo'],
        ['reference_azmora', 'Referência interna'],
        ['description_azmora', 'Descrição', 'text'],
      ],
      'Inventário e preço': [
        ['availability', 'Situação comercial', 'stock'],
        ['public_price_eur', 'Preço final (€)', 'num'],
        ['condition', 'Estado de conservação'],
      ],
      'Ficha técnica': [
        ['typology', 'Tipologia'],
        ['year', 'Ano', 'num'],
        ['bedrooms', 'Quartos', 'num'],
        ['bathrooms', 'Casas de banho confirmadas', 'num'],
        ['bathroom_count_minimum', 'Número mínimo de casas de banho', 'num'],
        ['bathroom_layout', 'Distribuição sanitária'],
        ['bedroom_sleeping_places', 'Lugares nos quartos', 'num'],
        ['dimensions_m.length', 'Comprimento anunciado (m)', 'num'],
        ['dimensions_m.width', 'Largura anunciada (m)', 'num'],
        ['area_m2', 'Área anunciada (m²)', 'num'],
        ['equipment_summary', 'Equipamento (um por linha)', 'text'],
      ],
      'Medidas de referência do modelo': [
        ['model_measure_reference.length', 'Comprimento de referência'],
        ['model_measure_reference.width', 'Largura de referência'],
        ['model_measure_reference.area', 'Área de referência'],
        ['model_measure_reference.note', 'Observação'],
      ],
      'Partilha e pesquisa': [
        ['seo_title', 'Título para pesquisa'],
        ['seo_description', 'Resumo para pesquisa'],
      ],
    };
    const inputs = new Map();
    for (const [title, items] of Object.entries(groups)) {
      const f = node('fieldset', ''),
        g = node('div', '');
      g.className = 'grid';
      f.append(node('legend', title), g);
      for (const [k, label, t] of items) {
        const l = node('label', label),
          i = document.createElement(
            t === 'stock' ? 'select' : t === 'text' ? 'textarea' : 'input',
          );
        if (t === 'num') {
          i.type = 'number';
          i.min = '0';
          i.step = 'any';
        }
        if (t === 'stock')
          for (const [value, title] of Object.entries(stock))
            i.add(new Option(title, value));
        i.required = ['brand', 'name_for_site'].includes(k);
        inputs.set(k, i);
        l.append(i);
        g.append(l);
      }
      el('fields').append(f);
    }
    function open(u, duplicate = false) {
      current = duplicate ? null : u;
      const d = u?.data || {};
      dirty = duplicate;
      media = structuredClone(d.media || []);
      el('heading').textContent = current ? 'Editar casa' : 'Adicionar casa';
      el('ref').textContent = current
        ? 'Identificador: ' + current.id + ' · ' + states[current.state]
        : '';
      for (const [k, i] of inputs) {
        const v = k.split('.').reduce((a, p) => a?.[p], d);
        i.value = Array.isArray(v)
          ? v.join('\n')
          : (v ?? (k === 'availability' ? 'por_confirmar' : ''));
      }
      if (duplicate) {
        inputs.get('name_for_site').value += ' (cópia)';
        inputs.get('reference_azmora').value = '';
        inputs.get('availability').value = 'por_confirmar';
      }
      el('featured').checked = !duplicate && !!d.featured;
      el('manage').replaceChildren();
      if (current) {
        el('manage').append(
          button('Duplicar ficha', () => {
            if (!dirty || confirm('Descartar alterações antes de duplicar?'))
              open(current, true);
          }),
        );
        if (current.state === 'archived') {
          el('manage').append(
            button('Recuperar como rascunho', () => save('draft')),
            button('Eliminar definitivamente', () => {
              if (
                prompt(
                  'Para eliminar, escreva a referência ' + current.slug,
                ) === current.slug
              )
                task(async () => {
                  await api('eliminar/', {
                    id: current.id,
                    revision: current.revision,
                    confirm: current.slug,
                  });
                  await finish('Casa eliminada.');
                });
            }),
          );
        } else
          el('manage').append(
            button('Arquivar casa', () => {
              if (confirm('Arquivar e retirar do catálogo?')) save('archived');
            }),
          );
      }
      el('dash').hidden = true;
      el('edit').hidden = false;
      drawPhotos();
      msg('');
      window.scrollTo(0, 0);
    }
    function data() {
      const d = {
        dimensions_m: {},
        model_measure_reference: {},
        media,
        featured: el('featured').checked,
      };
      for (const [k, i] of inputs) {
        let value = i.value.trim();
        if (k === 'equipment_summary')
          value = value
            .split('\n')
            .map((v) => v.trim())
            .filter(Boolean);
        else if (i.type === 'number')
          value = value === '' ? null : Number(value);
        else if (!value) value = null;
        const [first, second] = k.split('.');
        if (second) {
          if (value !== null || first === 'dimensions_m')
            d[first][second] = value;
        } else if (
          value !== null ||
          ![
            'seo_title',
            'seo_description',
            'bedroom_sleeping_places',
            'bathroom_count_minimum',
          ].includes(k)
        )
          d[k] = value;
      }
      return d;
    }
    async function finish(message) {
      dirty = false;
      el('edit').hidden = true;
      el('dash').hidden = false;
      await load();
      msg(message);
    }
    function save(state) {
      if (!el('form').reportValidity()) return;
      if (
        current?.state === 'live' &&
        state === 'draft' &&
        !confirm('Guardar como rascunho e retirar esta casa do site?')
      )
        return;
      task(async () => {
        await api('guardar/', {
          id: current?.id,
          revision: current?.revision,
          data: data(),
          state,
        });
        await finish('Alterações guardadas.');
      });
    }
    function img(m) {
      const i = document.createElement('img');
      i.src = base + 'foto/?key=' + encodeURIComponent(m.src);
      i.alt = m.alt;
      return i;
    }
    function drawPhotos() {
      el('photos').replaceChildren(
        ...media.map((m, i) => {
          const p = node('div', '');
          p.className = 'photo';
          const label = node('label', 'Legenda da fotografia ' + (i + 1)),
            input = document.createElement('input');
          input.value = m.alt;
          input.required = true;
          input.oninput = () => {
            m.alt = input.value;
            dirty = true;
          };
          label.append(input);
          function move(n) {
            media.splice(i, 1);
            media.splice(n, 0, m);
            dirty = true;
            drawPhotos();
          }
          p.append(img(m), label);
          if (i)
            p.append(
              button('Usar como capa', () => move(0)),
              button('Anterior', () => move(i - 1)),
            );
          if (i < media.length - 1)
            p.append(button('Seguinte', () => move(i + 1)));
          p.append(
            button('Substituir', () => {
              const f = document.createElement('input');
              f.type = 'file';
              f.accept = 'image/jpeg,image/png,image/webp';
              f.onchange = () => upload(f.files, i);
              f.click();
            }),
            button('Remover', () => {
              if (confirm('Retirar esta fotografia da ficha?')) {
                media.splice(i, 1);
                dirty = true;
                drawPhotos();
              }
            }),
          );
          return p;
        }),
      );
    }
    function upload(files, index) {
      task(async () => {
        for (const file of files) {
          if (
            file.size > 12 * 1024 * 1024 ||
            !['image/png', 'image/webp', 'image/jpeg'].includes(file.type)
          )
            throw Error('Escolha uma imagem JPEG, PNG ou WebP até 12 MB.');
          const bitmap = await createImageBitmap(file);
          const ratio = Math.min(
            1,
            1800 / Math.max(bitmap.width, bitmap.height),
          );
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(bitmap.width * ratio));
          canvas.height = Math.max(1, Math.round(bitmap.height * ratio));
          const c = canvas.getContext('2d', { alpha: false });
          c.fillStyle = 'white';
          c.fillRect(0, 0, canvas.width, canvas.height);
          c.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
          bitmap.close();
          const blob = await new Promise((resolve) =>
            canvas.toBlob(resolve, 'image/webp', 0.83),
          );
          if (!blob || blob.type !== 'image/webp')
            throw Error('Este navegador não conseguiu preparar a fotografia.');
          const m = await api('upload/', blob, 'image/webp');
          m.alt =
            index == null
              ? file.name.replace(/\.[^.]+$/, '')
              : media[index].alt;
          if (index == null) media.push(m);
          else media[index] = m;
          dirty = true;
          drawPhotos();
        }
        el('files').value = '';
        msg('Fotografias preparadas. Guarde a ficha.');
      });
    }
    el('files').onchange = (e) => upload(e.target.files);
    el('drop').ondragover = (e) => e.preventDefault();
    el('drop').ondrop = (e) => {
      e.preventDefault();
      upload(e.dataTransfer.files);
    };
    el('closePreview').onclick = () => el('preview').close();
    el('peek').onclick = () => {
      const d = data(),
        s = el('sample');
      s.replaceChildren(
        node('h2', d.name_for_site || 'Nova casa'),
        node('p', d.description_azmora || ''),
        ...media.map(img),
      );
      for (const items of Object.values(groups))
        for (const [k, label] of items) {
          const value = inputs.get(k).value;
          if (value)
            s.append(
              node(
                'p',
                label + ' · ' + (k === 'availability' ? stock[value] : value),
              ),
            );
        }
      el('preview').showModal();
    };
    el('form').onsubmit = (e) => {
      e.preventDefault();
      save(e.submitter.value);
    };
    el('form').oninput = () => (dirty = true);
    el('add').onclick = () => open(null);
    el('back').onclick = () => {
      if (!dirty || confirm('Sair sem guardar as alterações?')) {
        dirty = false;
        el('edit').hidden = true;
        el('dash').hidden = false;
        msg('');
      }
    };
    window.addEventListener('beforeunload', (e) => {
      if (dirty || busy) {
        e.preventDefault();
        e.returnValue = '';
      }
    });
    for (const id of ['sort', 'filter', 'search']) el(id).oninput = draw;
    task(load);
  </script>
</html>
